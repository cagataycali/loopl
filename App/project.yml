# Lives in App/ so the xcodeproj is NOT in the Swift package root (Xcode then
# confuses the package's targets with the app's). Generate with `xcodegen -s App/project.yml`.
name: LooplApp
options:
  bundleIdPrefix: technology.tiny
  deploymentTarget:
    iOS: '18.0'
  xcodeVersion: '26.4'
settings:
  base:
    DEVELOPMENT_TEAM: K6B7JDYLLL
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SWIFT_STRICT_CONCURRENCY: complete
    # MLX + safetensors want the big address space; Metal only exists on device.
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
packages:
  # The SDK lives in this repo's Package.swift (products Loopl / LooplRuntimes /
  # LooplUI). MLX + swift-transformers are its dependencies, not the app's.
  Loopl:
    path: ..
targets:
  # Target/module LooplApp, product loopl.app — never `loopl`: case-insensitive
  # disks make loopl.build / loopl.swiftmodule collide with the package's Loopl.
  LooplApp:
    type: application
    platform: iOS
    sources:
    - Sources
    - Assets.xcassets
    # NOT a folder reference: a top-level "Resources" dir inside an iOS .app
    # makes the installer fail with "Missing bundle ID" (it reads as a macOS bundle).
    - path: Resources
      buildPhase: resources
    dependencies:
    - package: Loopl
      product: Loopl
    - package: Loopl
      product: LooplRuntimes
    - package: Loopl
      product: LooplUI
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: loopl
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
        - processing
        # Models are 0.4–2.5 GB; URLSession downloads keep running briefly in background.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: loopl.entitlements
      properties:
        # MLX maps whole safetensors files; iOS caps a plain app well below
        # 8 GB. The increased-memory-limit entitlement raises the jetsam ceiling
        # on A17 Pro+/M-series (Apple: "com.apple.developer.kernel.increased-memory-limit").
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.tiny.loopl
        # The app module must not be `loopl`: on a case-insensitive disk its
        # loopl.swiftmodule collides with the SDK's Loopl.swiftmodule.
        PRODUCT_NAME: loopl
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_OBJC_INTEROP_MODE: objc
        ENABLE_USER_SCRIPT_SANDBOXING: false
  # The SDK tests, hosted by the app so `xcodebuild test` on a simulator runs them
  # (same files as the SwiftPM test target; swift test runs them on the Mac).
  LooplTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: ../Tests/LooplTests
      excludes: [Fixtures]
    dependencies:
    - target: LooplApp
    - package: Loopl
      product: Loopl
    info:
      path: Tests-Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.tiny.loopl.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  loopl:
    build:
      targets:
        LooplApp: all
        LooplTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
      - LooplTests
    archive:
      config: Release
