name: loopl
options:
  bundleIdPrefix: technology.tiny
  deploymentTarget:
    iOS: '18.0'
  xcodeVersion: '26.4'
settings:
  base:
    DEVELOPMENT_TEAM: K6B7JDYLLL
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SWIFT_STRICT_CONCURRENCY: complete
    # MLX + safetensors want the big address space; Metal only exists on device.
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
packages:
  # On-device inference: ml-explore/mlx-swift-lm (the libraries moved out of
  # mlx-swift-examples in 2025; README of that repo says so). Products
  # MLXLLM + MLXLMCommon only — NOT MLXHuggingFace (its macros pull
  # MLXFoundationModels, which needs iOS 27 types under the default trait).
  # We write the Downloader / TokenizerLoader bridges by hand (Runtime/MLXBridges.swift).
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  # Tokenizers (BPE/SentencePiece + Jinja chat templates) for the MLX path.
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.4
targets:
  loopl:
    type: application
    platform: iOS
    sources:
    - loopl/Sources
    - loopl/Assets.xcassets
    - path: loopl/Resources
      type: folder
      buildPhase: resources
    dependencies:
    - package: mlx-swift-lm
      product: MLXLLM
    - package: mlx-swift-lm
      product: MLXLMCommon
    - package: swift-transformers
      product: Tokenizers
    - package: swift-transformers
      product: Hub
    info:
      path: loopl/Info.plist
      properties:
        CFBundleDisplayName: loopl
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        UIBackgroundModes:
        - processing
        # Models are 0.4–2.5 GB; URLSession downloads keep running briefly in background.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: loopl/loopl.entitlements
      properties:
        # MLX maps whole safetensors files; iOS caps a plain app well below
        # 8 GB. The increased-memory-limit entitlement raises the jetsam ceiling
        # on A17 Pro+/M-series (Apple: "com.apple.developer.kernel.increased-memory-limit").
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.tiny.loopl
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_OBJC_INTEROP_MODE: objc
        ENABLE_USER_SCRIPT_SANDBOXING: false
  looplTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - Tests
    dependencies:
    - target: loopl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.tiny.loopl.tests
schemes:
  loopl:
    build:
      targets:
        loopl: all
        looplTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
      - looplTests
    archive:
      config: Release
