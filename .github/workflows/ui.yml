name: ui
# The geometry and layout guards (`looplUITests`) — a SEPARATE job from `ci`, run only on pushes
# to main, so PR CI stays at ~12 minutes while a guard that goes red is still seen within the hour
# instead of "for days". That is not hypothetical: `InsetsUITests.testSettingsDeleteHistoryButton…`
# was red on main from IMPROVE-3 #120 (the delete buttons moved behind Settings › Storage) until
# #170 repaired it, because nothing ran this target.
#
# The live suites in this target skip themselves without a Hugging Face token, and nothing is passed in
# on purpose — but a skipped UI test still builds and LAUNCHES the app, which is the expensive part, so
# they are skipped at the xcodebuild level instead (see SKIP below). Everything else runs, including new
# files nobody remembered to add to a list.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'mkdocs.yml', 'requirements-docs.txt', '.github/workflows/docs.yml']
  workflow_dispatch:
concurrency:
  group: ui-${{ github.ref }}
  # NOT cancel-in-progress. Measured on the first run: during a batch main is pushed every ~20 minutes
  # and this job takes ~30, so cancelling the previous run means NO run ever finishes — the first one
  # (b7a916c4) was cancelled 3 seconds in by the build-30 bump. A post-merge guard that never reports is
  # not a guard, so runs queue instead.
  cancel-in-progress: false
jobs:
  uitests:
    name: looplUITests (iOS Simulator, post-merge)
    runs-on: macos-26
    timeout-minutes: 90   # measured: ~5 min to build for testing, ~25-30 min for the suite
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Cache SwiftPM checkouts (mlx-swift is big)
        uses: actions/cache@v4
        with:
          path: |
            DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('App/project.yml', 'Package.swift', 'Package.resolved', '**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: xcodegen
        run: |
          brew install xcodegen >/dev/null 2>&1 || brew upgrade xcodegen >/dev/null 2>&1 || true
          xcodegen generate -s App/project.yml
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];c=[x for k,v in d.items() if "iOS" in k for x in v if "iPhone" in x["name"]];c.sort(key=lambda x:x["name"]);print(c[-1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"; xcrun simctl list devices available | grep "$UDID"
      - name: Boot the simulator (UI tests need a warm device)
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b || true
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild -project App/LooplApp.xcodeproj -scheme looplUITests -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -skipMacroValidation \
            build-for-testing 2>&1 | tail -n 80
      - name: UI tests
        run: |
          set -o pipefail
          # The five suites that only exist to drive a real Hugging Face job: they would XCTSkip here
          # (no token), but each test still launches the app first, which is seconds we spend for nothing.
          SKIP="-skip-testing:LooplUITests/TrainLiveUITests \
                -skip-testing:LooplUITests/TrainE2EMineUITests \
                -skip-testing:LooplUITests/TrainContinualLiveUITests \
                -skip-testing:LooplUITests/CollectionLiveUITests \
                -skip-testing:LooplUITests/HubShareUITests"
          START=$(date +%s)
          xcodebuild -project App/LooplApp.xcodeproj -scheme looplUITests -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -skipMacroValidation \
            $SKIP -resultBundlePath DerivedData/ui.xcresult \
            test-without-building 2>&1 | tee ui.log | tail -n 120
          echo "### looplUITests: $(( ($(date +%s) - START) / 60 )) min" >> "$GITHUB_STEP_SUMMARY"
          grep -E "Executed [0-9]+ tests" ui.log | tail -n 1 >> "$GITHUB_STEP_SUMMARY" || true
      # The slowest suites, so the next person trimming this job has numbers instead of a guess.
      - name: Where the time went
        if: always()
        run: |
          grep -E "^Test Suite '.*' (passed|failed) at" -A 1 ui.log \
            | grep -E "Executed|Test Suite" | paste - - 2>/dev/null \
            | sed -E "s/Test Suite '([^']+)'.*Executed ([0-9]+) tests.*in ([0-9.]+) .*/\3s  \2 tests  \1/" \
            | sort -rn | head -n 15 | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Which tests failed (names, not a tail)
        if: failure()
        run: |
          grep -E "error:|failed \(|Test Case .* failed" ui.log | head -n 60 || true
      - name: Keep the result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-xcresult
          path: DerivedData/ui.xcresult
          retention-days: 7
          if-no-files-found: ignore
