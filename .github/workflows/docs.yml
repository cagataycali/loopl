name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "Sources/**"
      - "Package.swift"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Native libs for social cards (cairo, freetype)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev > /dev/null
      - run: pip install -r requirements-docs.txt
      - name: Regenerate models table from the bundled catalog
        run: python3 docs/gen_models.py
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Every ```swift block tagged `// snippet: compile` must typecheck against the current package (docs/check_snippets.sh).
  snippets:
    runs-on: macos-26   # mlx-swift 0.32.3 needs Swift tools 6.3 → Xcode 26.x (same runner as ci.yml)
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version && swift --version
      - uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: snippets-spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: snippets-spm-${{ runner.os }}-
      - run: ./docs/check_snippets.sh

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Optional mirror to Cloudflare Pages (project "loopl"). Runs only when the
  # repository secret CLOUDFLARE_API_TOKEN exists (Pages:Edit on the account).
  cloudflare:
    needs: build
    if: ${{ vars.CLOUDFLARE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt && python3 docs/gen_models.py && LOOPL_SOCIAL_CARDS=false mkdocs build --strict
      - run: npx -y wrangler pages deploy site --project-name loopl --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
